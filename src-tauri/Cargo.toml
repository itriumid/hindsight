[package]
name = "hindsight"
version = "0.1.0"
description = "Keep the last few minutes of what was said, in case you need them."
authors = ["Itrium"]
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's, which Windows needs:
# https://github.com/rust-lang/cargo/issues/8519
name = "hindsight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
hindsight-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
